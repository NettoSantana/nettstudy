<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4b5bdc"><title>{{ nome_produto }} | Login</title><link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"></head><body><main class="login-pagina"><section class="login-card"><a class="marca" href="{{ url_for('inicio') }}"><span class="marca-simbolo">N</span><span>NettStudy</span></a><h1>Acesse sua conta</h1><p class="rodape-nota">Entre como responsável ou aluno.</p>{% with mensagens = get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="flash {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}<form class="formulario" method="post"><div class="campo"><label for="identificador">E-mail ou usuário</label><input id="identificador" name="identificador" value="{{ identificador or '' }}" required autocomplete="username"></div><div class="campo"><label for="senha">Senha ou PIN</label><input id="senha" name="senha" type="password" required autocomplete="current-password"></div><button class="botao botao-primario" type="submit">Entrar</button></form><div class="separador"><span>ou</span></div><a class="botao botao-secundario botao-largo" href="{{ url_for('novo_cadastro') }}">Criar uma conta</a></section></main><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/service-worker.js');}</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <meta name="theme-color" content="#4b5bdc">

    <title>{{ nome_produto }} | Login</title>

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >

    <style>
        :root {
            --login-primary: #4e5ce6;
            --login-primary-dark: #3f49c4;
            --login-bg: #f3f5ff;
            --login-card: #ffffff;
            --login-text: #18203a;
            --login-muted: #68718c;
            --login-border: #dfe3f3;
            --login-soft: #eef0ff;
            --login-error-bg: #fff0f0;
            --login-error-text: #9f2525;
            --login-success-bg: #edf9f2;
            --login-success-text: #176d40;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--login-bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--login-text);
            background:
                radial-gradient(
                    circle at 50% 0,
                    rgba(78, 92, 230, 0.12),
                    transparent 38%
                ),
                var(--login-bg);
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .login-pagina {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding:
                max(24px, env(safe-area-inset-top))
                18px
                max(30px, env(safe-area-inset-bottom));
        }

        .login-layout {
            width: min(100%, 940px);
            display: grid;
            grid-template-columns: minmax(280px, 0.8fr) minmax(380px, 1fr);
            align-items: center;
            gap: 34px;
        }

        .login-mascote {
            position: relative;
            min-height: 580px;
            display: grid;
            place-items: end center;
            overflow: hidden;
            border: 1px solid var(--login-border);
            border-radius: 28px;
            background:
                radial-gradient(
                    circle at 50% 55%,
                    rgba(75, 126, 255, 0.24),
                    transparent 45%
                ),
                linear-gradient(
                    160deg,
                    #eef2ff,
                    #ffffff 70%
                );
            box-shadow: 0 22px 55px rgba(30, 43, 90, 0.08);
        }

        .login-mascote::before {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            top: 80px;
            border-radius: 50%;
            background: rgba(78, 92, 230, 0.11);
            filter: blur(12px);
        }

        .login-mascote img {
            position: relative;
            z-index: 1;
            width: min(112%, 500px);
            max-height: 560px;
            object-fit: contain;
            object-position: bottom center;
        }

        .login-card {
            width: min(100%, 460px);
            padding: 34px;
            border: 1px solid var(--login-border);
            border-radius: 24px;
            background: var(--login-card);
            box-shadow: 0 22px 55px rgba(30, 43, 90, 0.12);
        }

        .marca {
            display: inline-flex;
            align-items: center;
            color: var(--login-primary);
            text-decoration: none;
        }

        .marca img {
            display: block;
            width: auto;
            height: 48px;
            max-width: 240px;
            object-fit: contain;
            object-position: left center;
        }

        .login-card h1 {
            margin: 22px 0 8px;
            font-size: clamp(30px, 7vw, 40px);
            line-height: 1.08;
            letter-spacing: -0.025em;
        }

        .rodape-nota {
            margin: 0 0 26px;
            color: var(--login-muted);
            font-size: 16px;
            line-height: 1.55;
        }

        .formulario {
            display: grid;
            gap: 18px;
        }

        .campo {
            display: grid;
            gap: 8px;
        }

        .campo label {
            color: var(--login-text);
            font-size: 15px;
            font-weight: 750;
        }

        .campo input {
            width: 100%;
            min-width: 0;
            min-height: 52px;
            padding: 13px 14px;
            border: 1px solid var(--login-border);
            border-radius: 13px;
            outline: none;
            color: var(--login-text);
            background: #ffffff;
            font: inherit;
            font-size: 16px;
            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .campo input:focus {
            border-color: var(--login-primary);
            box-shadow: 0 0 0 4px rgba(78, 92, 230, 0.13);
        }

        .botao {
            width: 100%;
            min-height: 52px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 18px;
            border: 0;
            border-radius: 13px;
            font: inherit;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }

        .botao:active {
            transform: scale(0.99);
        }

        .botao-primario {
            color: #ffffff;
            background: var(--login-primary);
            box-shadow: 0 10px 22px rgba(78, 92, 230, 0.22);
        }

        .botao-primario:hover {
            background: var(--login-primary-dark);
        }

        .botao-secundario {
            color: var(--login-primary);
            background: var(--login-soft);
        }

        .botao-largo {
            width: 100%;
        }

        .separador {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--login-muted);
            font-size: 14px;
        }

        .separador::before,
        .separador::after {
            content: "";
            height: 1px;
            background: var(--login-border);
        }

        .flash {
            margin: 0 0 20px;
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
        }

        .flash.erro {
            color: var(--login-error-text);
            background: var(--login-error-bg);
            border: 1px solid #efc8c8;
        }

        .flash.sucesso {
            color: var(--login-success-text);
            background: var(--login-success-bg);
            border: 1px solid #c7e6d3;
        }

        .flash.aviso {
            color: #745812;
            background: #fff8df;
            border: 1px solid #eedc9a;
        }

        @media (max-width: 820px) {
            .login-layout {
                grid-template-columns: 1fr;
                max-width: 520px;
            }

            .login-mascote {
                min-height: 250px;
            }

            .login-mascote img {
                width: min(72%, 320px);
                max-height: 300px;
            }
        }

        @media (max-width: 520px) {
            .login-pagina {
                place-items: start center;
                padding:
                    max(22px, env(safe-area-inset-top))
                    14px
                    max(26px, env(safe-area-inset-bottom));
            }

            .login-card {
                margin-top: 12px;
                padding: 24px 20px;
                border-radius: 20px;
                box-shadow: 0 16px 38px rgba(30, 43, 90, 0.1);
            }

            .marca img {
                height: 42px;
                max-width: 210px;
            }

            .login-mascote {
                min-height: 210px;
                border-radius: 20px;
            }

            .login-mascote img {
                width: min(78%, 280px);
                max-height: 250px;
            }

            .login-card h1 {
                margin-top: 20px;
                font-size: 32px;
            }

            .rodape-nota {
                margin-bottom: 22px;
                font-size: 15px;
            }

            .formulario {
                gap: 16px;
            }
        }

        @media (max-width: 360px) {
            .login-card {
                padding: 22px 16px;
            }

            .login-card h1 {
                font-size: 29px;
            }
        }
    </style>
</head>
<body>
    <main class="login-pagina">
        <div class="login-layout">
            <aside class="login-mascote" aria-hidden="true">
                <img
                    src="{{ url_for('static', filename='img/nettstudy-mascote.png') }}"
                    alt=""
                >
            </aside>

            <section class="login-card">
                <a
                    class="marca"
                    href="{{ url_for('inicio') }}"
                    aria-label="NettStudy - Página inicial"
                >
                    <img
                        src="{{ url_for('static', filename='img/nettstudy-logo.png') }}"
                        alt="NettStudy"
                    >
                </a>

            <h1>Acesse sua conta</h1>

            <p class="rodape-nota">
                Entre como responsável ou aluno.
            </p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    {% for categoria, mensagem in mensagens %}
                        <div class="flash {{ categoria }}">
                            {{ mensagem }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form class="formulario" method="post">
                <div class="campo">
                    <label for="identificador">
                        E-mail ou usuário
                    </label>

                    <input
                        id="identificador"
                        name="identificador"
                        type="text"
                        value="{{ identificador or '' }}"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">
                        Senha ou PIN
                    </label>

                    <input
                        id="senha"
                        name="senha"
                        type="password"
                        autocomplete="current-password"
                        inputmode="text"
                        required
                    >
                </div>

                <button
                    class="botao botao-primario"
                    type="submit"
                >
                    Entrar
                </button>
            </form>

            <a class="voltar" style="display:block;margin-top:18px;text-align:center;color:#4e5ce6;font-weight:700;text-decoration:none" href="{{ url_for('recuperar_acesso') }}">
                Esqueci minha senha ou PIN
            </a>

            <div class="separador">
                <span>ou</span>
            </div>

            <a
                class="botao botao-secundario botao-largo"
                href="{{ url_for('novo_cadastro') }}"
            >
                Criar uma conta
            </a>
            </section>
        </div>
    </main>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/service-worker.js");
        }
    </script>
</body>
</html>

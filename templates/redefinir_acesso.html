<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NettStudy | Redefinir acesso</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f5ff;color:#18203a;font-family:Inter,Arial,sans-serif}.pagina{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,520px);background:#fff;border:1px solid #dfe3f3;border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(30,43,90,.1)}.marca{color:#4e5ce6;font-size:22px;font-weight:800;text-decoration:none}.card h1{margin:24px 0 8px;font-size:34px}.nota{color:#68718c;line-height:1.55}.campo{display:grid;gap:8px;margin:18px 0}.campo label{font-weight:700}.campo input,.campo select{width:100%;min-height:52px;border:1px solid #dfe3f3;border-radius:13px;padding:12px 14px;font:inherit;font-size:16px}.botao{width:100%;min-height:52px;border:0;border-radius:13px;background:#4e5ce6;color:#fff;font:inherit;font-weight:800;cursor:pointer}.voltar{display:block;margin-top:18px;text-align:center;color:#4e5ce6;font-weight:700;text-decoration:none}.flash{padding:13px;border-radius:12px;margin:16px 0;background:#fff0f0;color:#9f2525}.opcoes{display:grid;gap:12px;margin:20px 0}.opcao{display:flex;gap:10px;padding:14px;border:1px solid #dfe3f3;border-radius:13px}.bloco{padding:16px;border:1px solid #dfe3f3;border-radius:16px;margin:16px 0}@media(max-width:520px){.pagina{padding:14px;place-items:start center}.card{padding:24px 20px;margin-top:10px}.card h1{font-size:30px}}
</style></head><body><main class="pagina"><section class="card"><a class="marca" href="{{ url_for('inicio') }}">NettStudy</a><h1>Redefinir acesso</h1><p class="nota">Escolha apenas um acesso para alterar. Depois da confirmação, este link será encerrado.</p>{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="flash {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}<form method="post"><div class="opcoes"><label class="opcao"><input type="radio" name="tipo" value="responsavel" required><span>Trocar senha do responsável</span></label><label class="opcao"><input type="radio" name="tipo" value="aluno" required><span>Trocar PIN de um aluno</span></label></div><div class="campo"><label for="aluno_id">Aluno</label><select id="aluno_id" name="aluno_id"><option value="">Selecione somente para trocar PIN</option>{% for aluno in recuperacao.alunos %}<option value="{{ aluno.id }}">{{ aluno.nome_exibicao }}</option>{% endfor %}</select></div><div class="campo"><label for="nova_senha">Nova senha ou PIN</label><input id="nova_senha" name="nova_senha" type="password" autocomplete="new-password" required></div><div class="campo"><label for="confirmar_senha">Confirmar senha ou PIN</label><input id="confirmar_senha" name="confirmar_senha" type="password" autocomplete="new-password" required></div><button class="botao" type="submit">Confirmar alteração</button></form></section></main></body></html>

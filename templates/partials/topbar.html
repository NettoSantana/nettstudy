<header class="topbar">
    <a
        class="marca marca-logo"
        href="{{ url_for('inicio') }}"
        aria-label="NettStudy - Página inicial"
    >
        <img
            src="{{ url_for('static', filename='img/nettstudy-logo.png') }}"
            alt="NettStudy"
        >
    </a>

    <div class="topbar-acoes">
        {% if usuario_logado %}
            <span>{{ usuario_logado }}</span>
            <a
                class="botao botao-secundario"
                href="{{ url_for('sair') }}"
            >
                Sair
            </a>
        {% else %}
            <a
                class="botao botao-primario"
                href="{{ url_for('login') }}"
            >
                Entrar
            </a>
        {% endif %}
    </div>
</header>
